name: Monitor

# Production health monitor: pings /api/health and the public storefront and
# verifies remote migrations are in sync. The weekly database backup lives in
# its own workflow (backup.yml) — its schedule must not depend on this file's
# cron list.
#
# Required secrets:
#   PROD_BASE_URL   - e.g. https://techstore.example.vercel.app
#   SUPABASE_DB_URL - postgres connection string (service-side secret)
#   CRON_SECRET     - shared secret guarding /api/cron/* (Vercel env)
#
# Until the secrets are set (pre-deploy), every job skips green instead of
# failing red every 15 minutes — see BACKLOG.md §A.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    name: Prod health probe
    runs-on: ubuntu-latest
    steps:
      - id: guard
        name: Skip until PROD_BASE_URL is set (pre-deploy)
        shell: bash
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_BASE_URL" ]; then
            echo 'skip: PROD_BASE_URL secret not set — no production deployment yet'
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Ping /api/health
        if: steps.guard.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            "${{ secrets.PROD_BASE_URL }}/api/health")
          echo "health status: $code"
          test "$code" = "200"

      - name: Probe database through /api/health?check=db
        if: steps.guard.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
            "${{ secrets.PROD_BASE_URL }}/api/health?check=db")
          echo "db probe status: $code"
          cat "$body"
          test "$code" = "200" || { echo 'database probe failed'; exit 1; }
          grep -q '"db":"ok"' "$body" || { echo 'database probe did not report ok'; exit 1; }
          rm -f "$body"

      - name: Probe storefront page
        if: steps.guard.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 30 "${{ secrets.PROD_BASE_URL }}/")
          echo "$body" | grep -q '<html' || { echo 'storefront did not render'; exit 1; }

  crons:
    name: Cron self-check
    runs-on: ubuntu-latest
    steps:
      - id: guard
        name: Skip until PROD_BASE_URL / CRON_SECRET are set (pre-deploy)
        shell: bash
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo 'skip: PROD_BASE_URL / CRON_SECRET secrets not set — no production deployment yet'
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run /api/cron/health
        if: steps.guard.outputs.skipped != 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 \
            -H "authorization: Bearer ${CRON_SECRET}" \
            "${{ secrets.PROD_BASE_URL }}/api/cron/health")
          echo "cron health status: $code"
          cat "$body"
          test "$code" = "200" || { echo 'cron self-check failed'; exit 1; }
          grep -q '"ok":true' "$body" || { echo 'cron self-check did not report ok'; exit 1; }
          rm -f "$body"

  database:
    name: Migration drift check
    runs-on: ubuntu-latest
    steps:
      - id: guard
        name: Skip until SUPABASE_DB_URL is set (pre-deploy)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo 'skip: SUPABASE_DB_URL secret not set — no production database linked yet'
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skipped != 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skipped != 'true'
        with:
          version: latest

      - name: Verify migrations applied on remote
        if: steps.guard.outputs.skipped != 'true'
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee /tmp/migrations.txt
          ! grep -qiE 'not migrated|missing' /tmp/migrations.txt
